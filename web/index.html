<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore mathematical curves and surfaces interactively in your browser.">
  <title>Mathematical playground</title>
  <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" href="./icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #0f1622; color: #dce5ef; font: 13px system-ui, sans-serif; }
    body { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100dvh; overflow: hidden; }
    #status { flex: none; margin: 0; padding: 6px 12px; min-height: 18px; background: #182132; }
    #playground { display: block; width: 100%; flex: 1; min-height: 0; min-width: 0; touch-action: none; }
    .project-footer { box-sizing: border-box; flex: none; width: 100%; max-width: 900px; margin: 16px auto 0; padding: 16px; border-top: 1px solid #405163; color: #b9c8d4; font: 14px/1.6 system-ui, sans-serif; text-align: center; }
    .project-footer a { color: #9adfff; text-underline-offset: 3px; }
    .project-footer a:hover { text-decoration-thickness: 2px; }
    .project-footer a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; border-radius: 2px; }
  </style>
</head>
<body>
  <p id="status" role="status">Loading playground…</p>
  <canvas id="playground" aria-label="Mathematical playground"></canvas>
  <footer class="project-footer">
    More apps by Matt Lee.
    <a href="https://eelwehttam.pages.dev/" target="_blank" rel="noopener noreferrer" aria-label="Explore all projects (opens in a new tab)">Explore all projects <span aria-hidden="true">↗</span></a>
  </footer>
  <noscript>JavaScript and WebAssembly are required to run the playground.</noscript>
  <script type="module">
    const status = document.getElementById('status');
    const failed = error => {
      status.textContent = 'App failed to start or stopped unexpectedly. See browser developer console for details; reload to retry.';
      console.error(error);
    };
    window.addEventListener('error', event => failed(event.error || event.message));
    window.addEventListener('unhandledrejection', event => failed(event.reason));
    try {
      const { default: init } = await import('./math_playground.js');
      await init();
    } catch (error) { failed(error); }
  </script>
</body>
</html>
