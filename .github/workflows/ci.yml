name: Rust checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy this revision to Cloudflare (main is production; other branches are previews)
        type: boolean
        default: false
      preview_pr:
        description: PR number for a preview (required when deploying a non-main branch)
        type: string
      pages_action:
        description: Lifecycle operation; defaults to dry run unless apply is enabled
        type: choice
        default: none
        options: [none, status-production, cleanup-preview, pause, resume, undeploy-production]
      apply:
        description: Apply the selected lifecycle operation
        type: boolean
        default: false
      confirm:
        description: Production confirmation must be math-viz:production
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  web:
    name: Build browser app
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install Wasm toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy --target wasm32-unknown-unknown
          rustup override set stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-release
          cache-bin: 'false'
      - uses: actions/cache@v5
        id: bindgen
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.129-linux-x64
      - name: Install matching wasm-bindgen CLI
        if: steps.bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Lint browser target
        run: cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - name: Build browser assets
        shell: pwsh
        run: ./scripts/build-web.ps1
      - name: Verify JS/Wasm pairing and hosting files
        run: node scripts/verify-web.mjs
      - name: Test deployment lifecycle policies
        run: node --test scripts/pages*.test.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: browser-app
          path: dist/web/
          if-no-files-found: error
          retention-days: 14
  deploy:
    name: Deploy browser app
    needs: [web, verify, coverage]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy && inputs.pages_action == 'none')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: cloudflare-math-viz-lifecycle
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: write
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_TOKEN: ${{ github.token }}
      PAGES_SERIALIZED: 'true'
      PREVIEW_PR: ${{ inputs.preview_pr }}
      TARGET: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      PAGES_HANDOFF: .pages-publish-handoff.json
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v7
        with:
          name: browser-app
          path: dist/web
      - name: Prepare upload through lifecycle guard
        id: guard
        run: node scripts/pages.mjs prepare-publish --target "$TARGET" --pr "$PREVIEW_PR" --apply
      - name: Upload through shared Cloudflare action
        if: steps.guard.outputs.publish == 'true'
        uses: Warsinger/cloudflare-pages-deploy/upload@e02331c579411ebc6375be6698e4fc8774c8da2b
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          github-token: ${{ github.token }}
          command: ${{ steps.guard.outputs.command }}
      - name: Verify upload and reconcile preview lifecycle
        if: steps.guard.outputs.publish == 'true'
        run: node scripts/pages.mjs finish-publish --target "$TARGET" --pr "$PREVIEW_PR" --apply

  pages-lifecycle:
    name: Pages lifecycle operation
    if: github.event_name == 'workflow_dispatch' && inputs.pages_action != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: cloudflare-math-viz-lifecycle
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Run trusted lifecycle operation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_SERIALIZED: 'true'
          PAGES_ACTION: ${{ inputs.pages_action }}
          PREVIEW_PR: ${{ inputs.preview_pr }}
          PAGES_APPLY: ${{ inputs.apply }}
          PAGES_CONFIRM: ${{ inputs.confirm }}
        run: node scripts/pages-operation.mjs
  coverage:
    name: Coverage (Linux debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev
      - name: Install coverage tools
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          rustup override set stable
          cargo install cargo-llvm-cov --version 0.9.1 --locked --root "$RUNNER_TEMP/coverage-tools"
          echo "$RUNNER_TEMP/coverage-tools/bin" >> "$GITHUB_PATH"
      - name: Restore instrumented dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-debug-coverage
          workspaces: ". -> target/llvm-cov-target"
          cache-bin: "false"
      - name: Run instrumented tests once
        run: cargo llvm-cov --locked --all-targets --target x86_64-unknown-linux-gnu --no-report
      - name: Generate reports from the same test run
        run: |
          mkdir -p dist/coverage
          cargo llvm-cov report --target x86_64-unknown-linux-gnu --ignore-filename-regex '(^|/)(tests|target)/' --html --output-dir dist/coverage
          cargo llvm-cov report --target x86_64-unknown-linux-gnu --ignore-filename-regex '(^|/)(tests|target)/' --lcov --output-path dist/coverage/lcov.info
          cargo llvm-cov report --target x86_64-unknown-linux-gnu --ignore-filename-regex '(^|/)(tests|target)/' --json --output-path dist/coverage/coverage.json
          python3 scripts/coverage-summary.py dist/coverage/coverage.json >> "$GITHUB_STEP_SUMMARY"
          test -s dist/coverage/html/index.html
          test -s dist/coverage/lcov.info
      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-linux-debug
          path: dist/coverage/
          if-no-files-found: error
          retention-days: 14
  formatting:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install formatter
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
  verify:
    needs: formatting
    name: Verify and package (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      RUST_BACKTRACE: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev
      - name: Install stable Rust tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc +stable --version
      - name: Restore Rust dependency and build cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-bin: "false"
      - name: Lint
        run: cargo +stable clippy --locked --target ${{ matrix.target }} --all-targets -- -D warnings
      - name: Debug tests
        run: cargo +stable test --locked --target ${{ matrix.target }} --all-targets
      - name: Release tests
        run: cargo +stable test --locked --release --target ${{ matrix.target }} --all-targets
      - name: Build release executable
        run: cargo +stable build --locked --release --target ${{ matrix.target }}
      - name: Package and verify contents
        run: ./scripts/package.ps1 -Target '${{ matrix.target }}'
      - name: Upload downloadable package and checksum
        uses: actions/upload-artifact@v6
        with:
          name: math-playground-${{ matrix.target }}
          path: |
            dist/math-playground-${{ matrix.target }}.zip
            dist/math-playground-${{ matrix.target }}.tar.gz
            dist/math-playground-${{ matrix.target }}.sha256
          if-no-files-found: error
          retention-days: 14

