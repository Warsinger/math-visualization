name: Rust checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +stable fmt --all -- --check
      - name: Lint
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo +stable test --locked --all-targets
      - name: Build
        run: cargo +stable build --locked
