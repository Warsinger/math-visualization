[package]
name = "math-playground"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A small Rust playground for exploring mathematical curves"
publish = false

[dependencies]
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["std"] }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[profile.dev]
opt-level = 1

# Keep optimized behavior while retaining backtrace locations for release failures.
[profile.release]
debug = 1
split-debuginfo = "off"
