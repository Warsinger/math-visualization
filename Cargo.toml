[package]
name = "math-playground"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A small Rust playground for exploring mathematical curves"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
directories = "6"
eframe = { version = "=0.36.2", default-features = false, features = ["persistence"] }
rolling-file = "0.2"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Element", "console"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[profile.dev]
opt-level = 1

# Keep optimized behavior while retaining backtrace locations for release failures.
[profile.release]
debug = 1
split-debuginfo = "off"

[build-dependencies]
winresource = "0.1.34"
